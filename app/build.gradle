apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao' // apply plugin

//定义时间
def releaseTime() {
    return new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
}

android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion
    defaultConfig {
        applicationId rootProject.ext.android.applicationId
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    signingConfigs {
        debug {
            storeFile file('D:/CodeProject/android_sign_keys/r2u11.jks')
            storePassword 'hzmct123456'
            keyPassword 'hzmct123456'
            keyAlias 'r2u11'
        }
        release {
            storeFile file('D:/CodeProject/android_sign_keys/r2u11.jks')
            storePassword 'hzmct123456'
            keyAlias 'r2u11'
            keyPassword 'hzmct123456'
        }
//        debug {
//            storeFile file('D:/CodeProject/android_sign_keys/kung_kangfu.jks')
//            storePassword '123456'
//            keyPassword '123456'
//            keyAlias 'kung'
//        }
//        release {
//            storeFile file('D:/CodeProject/android_sign_keys/kung_kangfu.jks')
//            storePassword '123456'
//            keyPassword '123456'
//            keyAlias 'kung'
//        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false // 是否开启混淆，开启之后不能debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    dataBinding {
        enabled true
    }

    sourceSets {
        main {
            jniLibs.srcDirs "src/main/libs"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    //配置打包名称
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                // 输出apk名称为news_v1.0_2017-01-15_wandoujia.apk
                def fileName = "dppf_v${defaultConfig.versionName}_${releaseTime()}.apk"
                outputFileName = fileName
            }
        }
    }

}

greendao {
    schemaVersion 5                         //指定数据库schema版本号，迁移等操作会用到;
    daoPackage 'com.kung.dppf.entity.greendao'   //dao的包名，包名默认是entity所在的包
    targetGenDir 'src/main/java'         //生成数据库文件的目录
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //support
    implementation rootProject.ext.support["design"]
    //下拉刷新,上拉加载
    implementation 'com.lcodecorex:tkrefreshlayout:1.0.7'
    //底部tabBar
    implementation('me.majiajie:pager-bottom-tab-strip:2.2.5') {
        exclude group: 'com.android.support'
    }
    //MVVMHabit
    implementation project(':mvvmhabit')
//    implementation rootProject.ext.dependencies.MVVMHabit
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    //内存泄漏测试
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.6.3'
    debugImplementation 'com.squareup.leakcanary:leakcanary-support-fragment:1.6.3'

    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'org.greenrobot:greendao:3.3.0' // add library
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.30'
    implementation 'pub.devrel:easypermissions:1.2.0'
    implementation 'com.aill:AndroidSerialPort:1.0.8'   //串口通信:AndroidSerialPort
    implementation 'com.github.JackiePenghe:SerialPortLibrary:1.0.4'

    implementation 'com.google.zxing:core:3.4.0'

    implementation 'com.tencent.bugly:crashreport_upgrade:latest.release'//其中latest.release指代最新版本号，也可以指定明确的版本号，例如1.2.0
    implementation 'com.tencent.bugly:nativecrashreport:latest.release' //其中latest.release指代最新版本号，也可以指定明确的版本号，例如2.2.0

    // Material Design Library
    implementation 'com.google.android.material:material:1.3.0-alpha03'
    implementation 'com.github.codbking:PickTime:v1.0.1'

    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'

    implementation 'me.jahnen.libaums:core:0.10.0'  //USB
    implementation 'com.alibaba:fastjson:1.2.2'
//    implementation project(':escposprinter')

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
}
